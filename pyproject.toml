[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apa7-tools"
version = "2.4.0"
description = "Herramientas APA 7 (7.ª ed.) para agentes de IA vía MCP: analiza, corrige, construye y valida documentos Word."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["apa", "apa7", "mcp", "docx", "word", "citations", "references", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Natural Language :: English",
]
dependencies = ["mcp>=1.2,<2", "python-docx>=1.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apa7-tools = "apa7_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apa7_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]
