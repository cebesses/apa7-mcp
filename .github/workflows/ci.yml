name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      APA7_OFFLINE: "1"   # las pruebas no dependen de la red (Crossref/Open Library)
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Pruebas
        run: python -m pytest -q
      - name: Diagnóstico
        run: python -m apa7_mcp doctor --offline

  package:
    name: Empaquetado (instalación limpia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: python -m pip install build && python -m build
      - name: Instalar en un entorno nuevo y probar
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/apa7-tools --version
          /tmp/clean/bin/apa7-tools doctor --offline
          /tmp/clean/bin/python -c "from apa7_mcp import rules; assert len(rules.list_rules()) > 50"
